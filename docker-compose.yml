name: inertia

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379
      RAILS_ENV: development
      JWT_SECRET_KEY: dev_secret_change_in_production
      # capacitor://localhost is the iOS app's WKWebView origin (see
      # frontend/capacitor.config.ts) — it bundles the same build Electron
      # does, but under that origin instead of file://, so it needs an
      # explicit CORS allow same as any other cross-origin API caller.
      CORS_ORIGINS: http://localhost:5174,capacitor://localhost
      BYPASS_AUTH: ${BYPASS_AUTH:-true}
      APP_URL: http://localhost:3000
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle

  # Same major version as the shared PostgreSQL that production uses.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: inertia_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  frontend:
    command: ["sh", "scripts/start-dev.sh"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "5174:5174"
    environment:
      API_URL: http://localhost:3000
      COLLAB_URL: ws://localhost:1234
      BYPASS_AUTH: ${BYPASS_AUTH:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # Real-time collaborative editing (Yjs/Hocuspocus) for Tiptap documents.
  # Holds no secrets of its own — onAuthenticate delegates both auth and
  # authorization to Rails' own GET /api/v1/documents/:id (see
  # collab-server/src/auth.ts).
  collab:
    build:
      context: ./collab-server
      dockerfile: Dockerfile.dev
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    ports:
      - "1234:1234"
    depends_on:
      - backend
    environment:
      RAILS_INTERNAL_URL: http://backend:3000
      PORT: "1234"
    volumes:
      - ./collab-server:/app
      - collab_node_modules:/app/node_modules

volumes:
  postgres_data:
  redis_data:
  backend_bundle:
  frontend_node_modules:
  collab_node_modules:
