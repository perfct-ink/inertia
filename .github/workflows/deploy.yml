name: Deploy

# Test gate, then deploy. Production is moving from the shared droplet to
# Coolify (docs/deployment.md). Once the COOLIFY_DEPLOY_WEBHOOK repository
# variable is set, `coolify` asks Coolify to build and deploy
# docker-compose.coolify.yml from main; until then `droplet` keeps shipping
# to the old host so production doesn't freeze mid-migration. Delete the
# `droplet` job and deploy/ once the domain is served from Coolify
# (docs/backlog/retire-droplet-deploy.md).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never interrupt a deploy that's already running; queue the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
          working-directory: backend

      - name: Set up test database
        working-directory: backend
        run: bin/rails db:create db:schema:load

      - name: Run test suite
        working-directory: backend
        run: bin/rails test

  coolify:
    needs: test
    if: vars.COOLIFY_DEPLOY_WEBHOOK != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Coolify's deploy webhook (the resource's Webhooks tab) with an API
      # token from Keys & Tokens. Coolify builds and health-checks the stack
      # itself; follow the deployment in its dashboard.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ vars.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          : "${COOLIFY_TOKEN:?Add the COOLIFY_TOKEN repository secret}"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_DEPLOY_WEBHOOK"

  droplet:
    needs: test
    if: vars.COOLIFY_DEPLOY_WEBHOOK == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # API_URL was never set here before, so this build would have shipped
      # with lib/api.ts's dev fallback (http://localhost:3000) baked into
      # every real visitor's bundle — broken regardless of collaboration.
      # Fixed alongside COLLAB_URL since it's the same build step.
      - name: Build frontend
        working-directory: frontend
        env:
          API_URL: https://inertia.it.com
          COLLAB_URL: wss://inertia.it.com/collab
        run: npm ci && npm run build

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: inertia-backend:latest

      - uses: docker/build-push-action@v7
        with:
          context: ./collab-server
          load: true
          tags: inertia-collab:latest

      - name: Configure SSH agent
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H inertia.it.com >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add - <<< "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Copy images to server
        run: |
          set -o pipefail
          docker save inertia-backend:latest inertia-collab:latest | gzip | ssh deploy@inertia.it.com 'gunzip | docker load'

      # bin/docker-entrypoint runs db:prepare on every start, so migrations
      # happen automatically once the container's up.
      - name: Deploy
        env:
          RAILS_ENV: ${{ vars.RAILS_ENV || 'production' }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: deploy/deploy.sh
