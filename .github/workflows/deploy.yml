name: Deploy

# Test gate, then deploy: `coolify` asks Coolify to build and deploy
# docker-compose.coolify.yml from main and waits for the result
# (docs/deployment.md).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never interrupt a deploy that's already running; queue the next one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_USERNAME: root
      DATABASE_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install MySQL client library
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"
          bundler-cache: true
          working-directory: backend

      - name: Set up test database
        working-directory: backend
        run: bin/rails db:create db:schema:load

      - name: Run test suite
        working-directory: backend
        run: bin/rails test

  coolify:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      COOLIFY_URL: https://coolify.homecloud.one
      # The `inertia` resource (Inertia project, production environment).
      COOLIFY_APP_UUID: smu9zcyqqxhwhd7fybqqmn7j
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
    steps:
      # Coolify builds the images and only switches traffic once the health
      # checks pass; this fails the run if the deployment fails.
      - name: Deploy with Coolify
        run: |
          : "${COOLIFY_API_TOKEN:?Add the COOLIFY_API_TOKEN repository secret}"
          auth="Authorization: Bearer $COOLIFY_API_TOKEN"
          deployment=$(curl --fail-with-body -sS -X POST -H "$auth" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=false" \
            | jq -er '.deployments[0].deployment_uuid')
          echo "Coolify deployment $deployment"
          while :; do
            sleep 15
            status=$(curl --fail-with-body -sS -H "$auth" "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r .status)
            echo "status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed|cancelled*) exit 1 ;;
            esac
          done
