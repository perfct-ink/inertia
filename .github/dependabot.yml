version: 2
updates:
- package-ecosystem: bundler
  directory: "/backend"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
- package-ecosystem: npm
  directory: "/frontend"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    tiptap:
      patterns: [ "@tiptap/*" ]
  ignore:
    # tiptap's 27 packages are tightly peer-coupled (core + every extension
    # must move together) and v3 is a breaking API change, not just a peer
    # bump — a single-package major update can never resolve on its own.
    # Do the v3 migration as one deliberate PR instead of via dependabot.
    - dependency-name: "@tiptap/*"
      update-types: [ "version-update:semver-major" ]
    # Babel 8 broke npm ci: @babel/preset-env 7 still needs @babel/core 7.
    # Move the core and presets to 8 together, by hand.
    - dependency-name: "@babel/*"
      update-types: [ "version-update:semver-major" ]
- package-ecosystem: npm
  directory: "/collab-server"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    tiptap:
      patterns: [ "@tiptap/*" ]
  ignore:
    # Mirrors the /frontend entry above — this schema-only mirror
    # (collab-server/src/schema.ts) must stay on the same Tiptap major line
    # as the frontend's real editor.
    - dependency-name: "@tiptap/*"
      update-types: [ "version-update:semver-major" ]
    # TypeScript 7 broke npm ci: typescript-eslint's peer range stops below
    # it. Move to 7 by hand once typescript-eslint supports it.
    - dependency-name: "typescript"
      update-types: [ "version-update:semver-major" ]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
