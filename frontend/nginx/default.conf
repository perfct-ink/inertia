# Production web server for the Coolify stack (docker-compose.coolify.yml).
# Serves the webpack build and reverse-proxies the Rails API and the collab
# WebSocket service over the stack's private network. Coolify's proxy
# (Traefik) terminates TLS in front of this and routes the public domain
# here on port 80, so there is no certbot or HTTPS server block.
#
# Upstreams are resolved per request through Docker's embedded DNS, so this
# container starts (and passes its health check) even while `api` or
# `collab` are still booting or being recreated.

# Traefik sends X-Forwarded-Proto: https. Pass that through to Rails rather
# than this hop's own scheme (always http), or production's force_ssl would
# redirect every proxied request forever.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $collab_upstream http://collab:1234;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    # Container health check (see docker-compose.coolify.yml). Answers from
    # nginx itself so a slow API boot doesn't mark the web service unhealthy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Marketing/SEO pages are the only HTML rendered by Rails (see
    # backend/app/controllers/marketing_controller.rb). Exact matches so they
    # don't shadow the SPA's own routes.
    location ~ ^/(features|pricing|about|robots\.txt|sitemap\.xml)?$ {
        proxy_pass $api_upstream;
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location /rails/active_storage/ {
        proxy_pass $api_upstream;
    }

    # Real-time document collaboration (Yjs/Hocuspocus, see collab-server/).
    # Matches /collab with or without the trailing slash: the provider
    # connects to COLLAB_URL as given (wss://.../collab).
    location ~ ^/collab(/|$) {
        rewrite ^/collab/?(.*)$ /$1 break;
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Long-lived WebSocket; nginx's 60s default would drop idle editors.
        proxy_read_timeout 300s;
    }

    # webpack's build output is flat with content-hashed filenames for
    # everything except index.html, so these are safe to cache for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
