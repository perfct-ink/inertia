# PostgreSQL. Development and test use the `postgres` service from
# docker-compose.yml (or any local server via the DATABASE_* variables).
#
# Production uses the shared PostgreSQL in Coolify's "Shared Infrastructure"
# project: DATABASE_URL (set in Coolify's Environment Variables tab) holds
# the whole connection string, and Rails merges it over the block below.
# See docs/deployment.md.
#
# Until DATABASE_URL is set, production stays on the old DigitalOcean managed
# MySQL cluster, whose connection info lives in the encrypted Rails
# credentials (config/credentials.yml.enc, decrypted via RAILS_MASTER_KEY).
# The same credentials are the source for `bin/rails db:import_mysql`, which
# copies that data into PostgreSQL. Drop the MySQL branch after cutover
# (docs/backlog/remove-mysql-after-postgres-cutover.md).
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "password") %>

development:
  <<: *default
  database: inertia_development

test:
  <<: *default
  database: inertia_test

# The managed MySQL database production used before PostgreSQL. It stays the
# production database until DATABASE_URL is set; after that it is only read
# once, by `rails db:import_mysql` (app/services/mysql_import.rb).
mysql_import: &mysql
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  database: inertia_production
  host: <%= Rails.application.credentials.dig(:database, :host) %>
  port: <%= Rails.application.credentials.dig(:database, :port) %>
  username: <%= Rails.application.credentials.dig(:database, :username) %>
  password: <%= Rails.application.credentials.dig(:database, :password) %>

<% if ENV["DATABASE_URL"].present? %>
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
<% else %>
production:
  <<: *mysql
<% end %>
